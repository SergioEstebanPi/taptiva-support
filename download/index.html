<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Taptiva — Remote Touch Control for Mac & Windows">
    <meta property="og:description"
        content="Turn your iPhone or Android phone into a remote touch controller for your Mac or Windows PC. Direct local connection, no account required.">
    <meta property="og:url" content="https://taptiva.tech/download/">
    <meta property="og:image" content="https://taptiva.tech/img/og-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Taptiva — Remote Touch Control for Mac & Windows">
    <meta name="twitter:description"
        content="Turn your iPhone or Android phone into a remote touch controller for your Mac or Windows PC. Direct local connection, no account required.">
    <meta name="twitter:image" content="https://taptiva.tech/img/og-image.png">

    <link rel="icon" type="image/png" href="/img/logo.png">
    <link rel="canonical" href="https://taptiva.tech/download/">

    <title>Downloading Taptiva</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KWKJR2DSM7"></script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'G-KWKJR2DSM7');
    </script>

    <style>
        :root {
            --bg: #000000;
            --text: #f5f5f7;
            --secondary: #8e8e93;
            --blue: #2997ff;
            --green: #30d158;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(41, 151, 255, 0.10),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Helvetica,
                Arial,
                sans-serif;

            text-align: center;
        }

        .container {
            width: min(90%, 520px);
            padding: 40px;
        }

        .logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: -1.5px;
            font-weight: 700;
        }

        .description {
            margin: 14px 0 0;
            color: var(--secondary);
            font-size: 16px;
            line-height: 1.5;
        }

        .spinner {
            width: 24px;
            height: 24px;
            margin: 30px auto 0;

            border: 2px solid rgba(255, 255, 255, .12);
            border-top-color: var(--blue);
            border-radius: 50%;

            animation: spin .8s linear infinite;
        }

        .spinner.done {
            animation: none;
            border: 2px solid var(--green);
            position: relative;
        }

        .spinner.done::after {
            content: "✓";

            position: absolute;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -52%);

            color: var(--green);
            font-size: 14px;
            font-weight: 700;
        }

        .status {
            margin-top: 18px;
            font-size: 13px;
            color: #636366;
        }

        .status.success {
            color: var(--green);
        }

        .fallback {
            margin-top: 24px;
            font-size: 13px;
            color: #636366;
        }

        .fallback a {
            color: var(--blue);
            text-decoration: none;
        }

        .fallback a:hover {
            text-decoration: underline;
        }

        .support {
            margin-top: 42px;
            padding-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, .08);
        }

        .support p {
            margin: 0 0 14px;
            color: #8e8e93;
            font-size: 14px;
            line-height: 1.5;
        }

        .support a {
            display: inline-block;
            color: #f5f5f7;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 9px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .08);
        }

        .support a:hover {
            background: rgba(255, 255, 255, .14);
        }

        .back {
            display: block;
            margin-top: 28px;
            color: #636366;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #8e8e93;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            class="logo"
            src="/img/big-logo.png"
            alt="Taptiva">

        <h1 id="title">
            Downloading Taptiva
        </h1>

        <p class="description" id="description">
            Your download should start automatically.
        </p>

        <div
            class="spinner"
            id="spinner"
            aria-hidden="true">
        </div>

        <div
            class="status"
            id="status">
            Taptiva 1.0 · Try for free
        </div>

        <p class="fallback">
            Download not starting?
            <a
                id="manualDownload"
                href="#"
                onclick="manualDownload(); return false;">
                Download manually
            </a>
        </p>

        <div class="support">

            <p>
                Enjoying Taptiva?
                You can support its development.
            </p>

            <a
                href="https://ko-fi.com/taptiva"
                target="_blank"
                rel="noopener noreferrer"
                onclick="gtag('event', 'ko_fi_click');">

                ☕ Support Taptiva

            </a>

        </div>

        <a
            class="back"
            href="/">

            ← Back to Taptiva

        </a>

    </main>


    <script>

        // ============================================================
        // DOWNLOAD CONFIGURATION
        // ============================================================

        const downloads = {

            mac: {

                url:
                    "https://github.com/SergioEstebanPi/taptiva-support/releases/latest/download/Taptiva.dmg",

                fileName:
                    "Taptiva.dmg",

                platform:
                    "macOS",

                description:
                    "Taptiva is being downloaded to your Mac."
            },

            windows: {

                url:
                    "https://github.com/SergioEstebanPi/taptiva-support/releases/latest/download/Taptiva.exe",

                fileName:
                    "Taptiva.exe",

                platform:
                    "Windows",

                description:
                    "Taptiva is being downloaded to your Windows PC."
            }

        };


        // ============================================================
        // SELECT PLATFORM FROM URL
        // ============================================================

        const params =
            new URLSearchParams(window.location.search);

        const requestedPlatform =
            params.get("platform");


        let selectedDownload;


        if (requestedPlatform === "windows") {

            selectedDownload =
                downloads.windows;

        } else {

            // Default to Mac when no platform is specified.
            selectedDownload =
                downloads.mac;
        }


        // ============================================================
        // ELEMENTS
        // ============================================================

        const spinner =
            document.getElementById("spinner");

        const title =
            document.getElementById("title");

        const description =
            document.getElementById("description");

        const status =
            document.getElementById("status");

        const manualDownloadLink =
            document.getElementById("manualDownload");


        // ============================================================
        // UPDATE MANUAL DOWNLOAD
        // ============================================================

        manualDownloadLink.href =
            selectedDownload.url;


        // ============================================================
        // DOWNLOAD
        // ============================================================

        let navigationStarted = false;


        function startDownload() {

            if (navigationStarted) {
                return;
            }

            navigationStarted = true;


            // Stop loader
            spinner.classList.add("done");


            // Update interface
            title.textContent =
                "Download started";


            description.textContent =
                selectedDownload.description;


            status.textContent =
                `Taptiva 1.0 · ${selectedDownload.platform}`;


            status.classList.add("success");


            const navigate = () => {

                window.location.href =
                    selectedDownload.url;

            };


            // ========================================================
            // ANALYTICS
            // ========================================================

            if (typeof gtag === "function") {

                let fallbackTimer =
                    setTimeout(() => {

                        navigate();

                    }, 700);


                gtag("event", "download", {

                    file_name:
                        selectedDownload.fileName,

                    version:
                        "1.0",

                    platform:
                        selectedDownload.platform,

                    location:
                        "download",

                    event_callback: () => {

                        clearTimeout(fallbackTimer);

                        navigate();

                    }

                });

            } else {

                navigate();

            }

        }


        // ============================================================
        // MANUAL DOWNLOAD
        // ============================================================

        function manualDownload() {

            if (typeof gtag === "function") {

                gtag("event", "download_manual", {

                    file_name:
                        selectedDownload.fileName,

                    version:
                        "1.0",

                    platform:
                        selectedDownload.platform,

                    location:
                        "download"

                });

            }

            window.location.href =
                selectedDownload.url;

        }


        // ============================================================
        // START AUTOMATIC DOWNLOAD
        // ============================================================

        setTimeout(() => {

            startDownload();

        }, 1000);

    </script>

</body>
</html>

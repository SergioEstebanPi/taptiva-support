<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Downloading Taptiva</title>

    <style>
        :root {
            --bg: #000000;
            --text: #f5f5f7;
            --secondary: #8e8e93;
            --blue: #2997ff;
            --green: #30d158;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(41, 151, 255, 0.10),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Helvetica,
                Arial,
                sans-serif;

            text-align: center;
        }

        .container {
            width: min(90%, 520px);
            padding: 40px;
        }

        .logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: -1.5px;
            font-weight: 700;
        }

        .description {
            margin: 14px 0 0;
            color: var(--secondary);
            font-size: 16px;
            line-height: 1.5;
        }

        .spinner {
            width: 24px;
            height: 24px;
            margin: 30px auto 0;

            border: 2px solid rgba(255, 255, 255, .12);
            border-top-color: var(--blue);
            border-radius: 50%;

            animation: spin .8s linear infinite;
        }

        .spinner.done {
            animation: none;
            border: 2px solid var(--green);
            position: relative;
        }

        .spinner.done::after {
            content: "✓";

            position: absolute;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -52%);

            color: var(--green);
            font-size: 14px;
            font-weight: 700;
        }

        .status {
            margin-top: 18px;
            font-size: 13px;
            color: #636366;
        }

        .status.success {
            color: var(--green);
        }

        .fallback {
            margin-top: 24px;
            font-size: 13px;
            color: #636366;
        }

        .fallback a {
            color: var(--blue);
            text-decoration: none;
        }

        .fallback a:hover {
            text-decoration: underline;
        }

        .support {
            margin-top: 42px;
            padding-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, .08);
        }

        .support p {
            margin: 0 0 14px;
            color: #8e8e93;
            font-size: 14px;
            line-height: 1.5;
        }

        .support a {
            display: inline-block;
            color: #f5f5f7;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 9px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .08);
        }

        .support a:hover {
            background: rgba(255, 255, 255, .14);
        }

        .back {
            display: block;
            margin-top: 28px;
            color: #636366;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #8e8e93;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            class="logo"
            src="/img/big-logo.png"
            alt="Taptiva">

        <h1 id="title">
            Downloading Taptiva
        </h1>

        <p class="description" id="description">
            Your download should start automatically.
        </p>

        <div
            class="spinner"
            id="spinner"
            aria-hidden="true">
        </div>

        <div
            class="status"
            id="status">
            Taptiva 1.0 · Free for Mac
        </div>

        <p class="fallback">
            Download not starting?
            <a
                href="https://github.com/SergioEstebanPi/taptiva-support/releases/latest/download/Taptiva.dmg"
                onclick="gtag('event', 'download_manual', {
                    file_name: 'Taptiva.dmg',
                    version: '1.0'
                });">
                Download manually
            </a>
        </p>

        <div class="support">

            <p>
                Taptiva is free.
                If you enjoy using it, you can support its development.
            </p>

            <a
                href="https://ko-fi.com/taptiva"
                target="_blank"
                rel="noopener noreferrer"
                onclick="gtag('event', 'ko_fi_click');">

                ☕ Support Taptiva

            </a>

        </div>

        <a
            class="back"
            href="/">

            ← Back to Taptiva

        </a>

    </main>

    <script>
        const downloadUrl =
            "https://github.com/SergioEstebanPi/taptiva-support/releases/latest/download/Taptiva.dmg";

        const spinner = document.getElementById("spinner");
        const title = document.getElementById("title");
        const description = document.getElementById("description");
        const status = document.getElementById("status");

        setTimeout(() => {

            // Stop the loader
            spinner.classList.add("done");

            // Update the interface
            title.textContent = "Download started";
            description.textContent =
                "Taptiva is being downloaded to your Mac.";

            status.textContent =
                "Taptiva 1.0 · Download in progress";

            status.classList.add("success");

            // Start the download
            window.location.href = downloadUrl;

        }, 1000);
    </script>

</body>
</html>

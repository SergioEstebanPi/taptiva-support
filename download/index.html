<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Downloading Taptiva</title>

    <style>
        :root {
            --bg: #000000;
            --text: #f5f5f7;
            --secondary: #8e8e93;
            --blue: #2997ff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(41, 151, 255, 0.10),
                    transparent 35%
                ),
                #000;

            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Helvetica,
                Arial,
                sans-serif;

            text-align: center;
        }

        .container {
            width: min(90%, 520px);
            padding: 40px;
        }

        .logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: -1.5px;
            font-weight: 700;
        }

        p {
            margin: 14px 0 0;
            color: var(--secondary);
            font-size: 16px;
            line-height: 1.5;
        }

        .spinner {
            width: 24px;
            height: 24px;
            margin: 30px auto 0;

            border: 2px solid rgba(255,255,255,.12);
            border-top-color: var(--blue);
            border-radius: 50%;

            animation: spin .8s linear infinite;
        }

        .status {
            margin-top: 18px;
            font-size: 13px;
            color: #636366;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            class="logo"
            src="/img/big-logo.png"
            alt="Taptiva">

        <h1>Downloading Taptiva</h1>

        <p>
            Your download should start automatically.
        </p>

        <div class="spinner"></div>

        <div class="status">
            Taptiva 1.0 · Free for Mac
        </div>

    </main>

    <script>
        const downloadUrl =
            "https://github.com/SergioEstebanPi/taptiva-support/releases/latest/download/Taptiva.dmg";

        setTimeout(() => {
            window.location.href = downloadUrl;

            setTimeout(() => {
                window.close();
            }, 2500);

        }, 500);
    </script>

</body>
</html>
